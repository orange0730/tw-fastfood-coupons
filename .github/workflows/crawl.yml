name: Crawl coupons

on:
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC = 台灣時間 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run crawler
        run: npm run crawl

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain data/coupons.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/coupons.json
            git commit -m "chore(data): update coupons"
            git push
          else
            echo "No data changes."
          fi
